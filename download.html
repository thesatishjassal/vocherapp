<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Library – Filters & Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <style>
    :root{
      --bg: #0b0f19;
      --card: #121829;
      --muted: #9aa4bf;
      --text: #e6ebff;
      --accent: #6ea8fe;
      --accent-2:#7c4dff;
      --success:#36d399;
      --ring: rgba(110,168,254,.35);
    }
    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--text); background:
        radial-gradient(1200px 600px at 10% -10%, rgba(124,77,255,.22), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(110,168,254,.16), transparent 60%),
        var(--bg);
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    .container{ max-width:1200px; margin:0 auto; padding:24px; }

    /* Header */
    .header{
      display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:space-between;
      margin-bottom:16px;
    }
    .brand{ display:flex; align-items:center; gap:12px; }
    .brand .logo{ width:36px; height:36px; border-radius:10px; background:linear-gradient(145deg,#1b2640,#0c1326); display:grid; place-items:center; box-shadow: 0 2px 12px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06); }
    .brand .logo span{ font-weight:700; color:#a0b8ff; }
    h1{ font-size:20px; margin:0; letter-spacing:.2px; }
    .badge{ font-size:12px; color:#cbd6ff; background: rgba(110,168,254,.12); padding:6px 10px; border-radius:999px; border:1px solid rgba(110,168,254,.25); }

    /* Toolbar */
    .toolbar{
      display:grid; grid-template-columns: 1fr 180px 180px 1fr 120px; gap:10px; position:sticky; top:0; z-index:20;
      background: linear-gradient(180deg, rgba(11,15,25,.85), rgba(11,15,25,.65));
      backdrop-filter: blur(12px);
      padding:12px; border-radius:16px; border:1px solid rgba(255,255,255,.06);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .input, .select, .multiselect, .btn{
      height:42px; border-radius:12px; background: #0f1526; border:1px solid rgba(255,255,255,.08); color:var(--text);
      padding:0 12px; outline:none; box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .15s ease, border-color .15s ease, background .2s;
    }
    .input:focus, .select:focus, .multiselect:focus{ box-shadow: 0 0 0 4px var(--ring); border-color: rgba(110,168,254,.6); }
    .input{ display:flex; align-items:center; gap:8px; }
    .input input{ flex:1; min-width:0; border:none; outline:none; background:transparent; color:var(--text); font-size:14px; }

    .btn{ display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font-weight:600; border:1px solid rgba(255,255,255,.12);} 
    .btn-primary{ background: linear-gradient(180deg, #6ea8fe, #5e92f3); color:#0c1426; }
    .btn-ghost{ background: transparent; }

    /* Pills */
    .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .chip{ padding:6px 10px; border-radius:999px; background:#11182c; border:1px solid rgba(255,255,255,.08); color:#c7d2fe; font-size:12px; display:flex; align-items:center; gap:6px; }
    .chip .x{ cursor:pointer; opacity:.7; }

    /* Grid */
    .grid{ display:grid; gap:16px; grid-template-columns: repeat(12, 1fr); margin-top:16px; }
    .sidebar{ grid-column: span 3; position:sticky; top:76px; align-self:start; }
    .content{ grid-column: span 9; }

    /* Sidebar card */
    .card{ background: linear-gradient(180deg, #11182c, #0c1326); border:1px solid rgba(255,255,255,.06); border-radius:16px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
    .card .card-header{ padding:14px 16px; border-bottom:1px solid rgba(255,255,255,.06); display:flex; align-items:center; justify-content:space-between; }
    .card .card-body{ padding:12px 16px 16px; }
    .section{ margin-bottom:14px; }
    .section h3{ margin:0 0 10px; font-size:13px; color:#b4c1ff; letter-spacing:.3px; text-transform:uppercase; }
    .checkbox{ display:flex; gap:10px; align-items:center; color:#d6ddff; font-size:14px; }
    .checkbox input{ width:18px; height:18px; }

    /* Products */
    .results-bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:10px 0; }
    .results-bar .count{ color:var(--muted); font-size:14px; }

    .cards{ display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
    .product{ position:relative; overflow:hidden; border-radius:16px; border:1px solid rgba(255,255,255,.06); background: radial-gradient(600px 200px at 0% 0%, rgba(110,168,254,.08), transparent 60%), #0f1526; transition: transform .2s ease, box-shadow .2s ease; }
    .product:hover{ transform: translateY(-2px); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
    .product .thumb{ height:120px; background: linear-gradient(145deg, #1a2240, #0e1430); display:grid; place-items:center; }
    .product .thumb img{ width:72px; height:72px; object-fit:contain; filter: drop-shadow(0 6px 16px rgba(0,0,0,.45)); }
    .product .body{ padding:14px; }
    .kvs{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
    .kv{ font-size:12px; padding:6px 8px; border-radius:999px; border:1px solid rgba(255,255,255,.08); color:#cbd6ff; background:#0b1224; }
    .actions{ display:flex; gap:8px; }
    .actions a{ text-decoration:none; }

    .empty{ text-align:center; color:#9aa4bf; padding:36px 10px; border:1px dashed rgba(255,255,255,.12); border-radius:16px; background: rgba(17,24,44,.4); }

    /* Responsive */
    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
      .sidebar{ position:static; grid-column: 1 / -1; }
      .content{ grid-column: 1 / -1; }
      .toolbar{ grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="logo"><span>PL</span></div>
        <div>
          <h1>Product Library</h1>
          <span class="badge">Filters · Search · Download Links</span>
        </div>
      </div>
      <button class="btn btn-primary" id="resetAll">Reset All</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="input" title="Search across brand, category, subcategory & filename">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M11 18C14.866 18 18 14.866 18 11C18 7.13401 14.866 4 11 4C7.13401 4 4 7.13401 4 11C4 14.866 7.13401 18 11 18Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input id="search" type="text" placeholder="Search products… (e.g., fan, philips, chandelier)" />
      </div>
      <select class="select" id="category"></select>
      <select class="select" id="subcategory" disabled></select>
      <select class="select" id="brand"></select>
      <button class="btn btn-ghost" id="clearFilters">Clear</button>
    </div>

    <div class="chips" id="activeChips"></div>

    <div class="grid">
      <aside class="sidebar">
        <div class="card">
          <div class="card-header"><strong>Quick Filters</strong><span style="color:var(--muted); font-size:12px;">Optional</span></div>
          <div class="card-body">
            <div class="section">
              <h3>Popular</h3>
              <div class="checkbox"><input type="checkbox" id="chkIndoor" data-category="Indoor Lighting"> <label for="chkIndoor">Indoor Lighting</label></div>
              <div class="checkbox"><input type="checkbox" id="chkOutdoor" data-category="Outdoor Lighting"> <label for="chkOutdoor">Outdoor Lighting</label></div>
              <div class="checkbox"><input type="checkbox" id="chkFans" data-category="Fans"> <label for="chkFans">Fans</label></div>
            </div>
            <div class="section">
              <h3>File Type</h3>
              <div class="checkbox"><input type="checkbox" class="filetype" value="pdf" id="ftPdf"> <label for="ftPdf">PDF</label></div>
              <div class="checkbox"><input type="checkbox" class="filetype" value="jpg" id="ftJpg"> <label for="ftJpg">JPG</label></div>
              <div class="checkbox"><input type="checkbox" class="filetype" value="png" id="ftPng"> <label for="ftPng">PNG</label></div>
            </div>
          </div>
        </div>
      </aside>

      <main class="content">
        <div class="results-bar">
          <div class="count" id="resultCount">0 results</div>
          <div class="count">Sorted by relevance</div>
        </div>
        <div class="cards" id="cards"></div>
        <div class="empty" id="emptyState" style="display:none;">No products match your filters. Try clearing filters or adjusting your search.</div>
      </main>
    </div>
  </div>

  <script>
    // --- Demo Data -----------------------------
    const db = {
      filters: {
        search: "",
        categories: [
          { name: "Indoor Lighting", subcategories: ["LED Bulbs", "Tube Lights", "Panel Lights", "Downlights"] },
          { name: "Outdoor Lighting", subcategories: ["Street Lights", "Flood Lights", "Garden Lights"] },
          { name: "Fans", subcategories: ["Ceiling Fans", "Table Fans", "Wall Fans", "Pedestal Fans"] },
          { name: "Switches", subcategories: ["Modular Switches", "Smart Switches", "Sockets", "Accessories"] },
          { name: "Exhaust Fan", subcategories: ["Kitchen Exhaust", "Bathroom Exhaust", "Industrial Exhaust"] },
          { name: "Fancy Lights", subcategories: ["Chandeliers", "Pendant Lights", "Wall Lights", "Lamps"] },
          { name: "Servo", subcategories: ["Servo Stabilizers", "Voltage Regulators"] },
          { name: "Automations", subcategories: ["Smart Home", "Sensors", "Controllers"] },
          { name: "Customize", subcategories: ["Custom Designs", "Made to Order"] }
        ],
        brands: ["Philips","Havells","Wipro","Syska","Usha","Crompton","Anchor","Jaquar","APC","L&T","Schneider","Orient","Bajaj","Custom"]
      },
      products: [
        { id: 1, brand: "Philips", logo: "https://dummyimage.com/200x200/0d1426/ffffff&text=P", category: "Indoor Lighting", subcategory: "LED Bulbs", filename: "philips-led-bulb.pdf", downloadlink: "https://example.com/downloads/philips-led-bulb.pdf" },
        { id: 2, brand: "Havells", logo: "https://dummyimage.com/200x200/0d1426/ffffff&text=H", category: "Outdoor Lighting", subcategory: "Street Lights", filename: "havells-street-light.jpg", downloadlink: "https://example.com/downloads/havells-street-light.jpg" },
        { id: 3, brand: "Usha", logo: "https://dummyimage.com/200x200/0d1426/ffffff&text=U", category: "Fans", subcategory: "Ceiling Fans", filename: "usha-ceiling-fan.png", downloadlink: "https://example.com/downloads/usha-ceiling-fan.png" },
        { id: 4, brand: "Anchor", logo: "https://dummyimage.com/200x200/0d1426/ffffff&text=A", category: "Switches", subcategory: "Modular Switches", filename: "anchor-modular-switch.pdf", downloadlink: "https://example.com/downloads/anchor-modular-switch.pdf" },
        { id: 5, brand: "Crompton", logo: "https://dummyimage.com/200x200/0d1426/ffffff&text=C", category: "Exhaust Fan", subcategory: "Kitchen Exhaust", filename: "crompton-exhaustfan.jpg", downloadlink: "https://example.com/downloads/crompton-exhaustfan.jpg" },
        { id: 6, brand: "Jaquar", logo: "https://dummyimage.com/200x200/0d1426/ffffff&text=J", category: "Fancy Lights", subcategory: "Chandeliers", filename: "jaquar-chandelier.png", downloadlink: "https://example.com/downloads/jaquar-chandelier.png" },
        { id: 7, brand: "APC", logo: "https://dummyimage.com/200x200/0d1426/ffffff&text=APC", category: "Servo", subcategory: "Servo Stabilizers", filename: "apc-servo-stabilizer.pdf", downloadlink: "https://example.com/downloads/apc-servo-stabilizer.pdf" },
        { id: 8, brand: "L&T", logo: "https://dummyimage.com/200x200/0d1426/ffffff&text=L%26T", category: "Automations", subcategory: "Smart Home", filename: "lt-home-automation.pdf", downloadlink: "https://example.com/downloads/lt-home-automation.pdf" },
        { id: 9, brand: "Custom", logo: "https://dummyimage.com/200x200/0d1426/ffffff&text=CU", category: "Customize", subcategory: "Custom Designs", filename: "custom-light-design.png", downloadlink: "https://example.com/downloads/custom-light-design.png" },
        { id: 10, brand: "Wipro", logo: "https://dummyimage.com/200x200/0d1426/ffffff&text=W", category: "Indoor Lighting", subcategory: "Downlights", filename: "wipro-downlight.pdf", downloadlink: "https://example.com/downloads/wipro-downlight.pdf" },
        { id: 11, brand: "Syska", logo: "https://dummyimage.com/200x200/0d1426/ffffff&text=S", category: "Indoor Lighting", subcategory: "Panel Lights", filename: "syska-panel-light.png", downloadlink: "https://example.com/downloads/syska-panel-light.png" },
        { id: 12, brand: "Bajaj", logo: "https://dummyimage.com/200x200/0d1426/ffffff&text=B", category: "Outdoor Lighting", subcategory: "Flood Lights", filename: "bajaj-floodlight.pdf", downloadlink: "https://example.com/downloads/bajaj-floodlight.pdf" }
      ]
    };

    // --- State --------------------------------
    const state = {
      search: "",
      category: "",
      subcategory: "",
      brand: "",
      filetypes: new Set()
    };

    // --- Helpers ------------------------------
    const toTitle = s => s;

    function populateFilters(){
      // Category select
      const $cat = $('#category');
      $cat.empty().append(`<option value="">All Categories</option>`);
      db.filters.categories.forEach(c => $cat.append(`<option value="${c.name}">${toTitle(c.name)}</option>`));

      // Brand select
      const $brand = $('#brand');
      $brand.empty().append(`<option value="">All Brands</option>`);
      db.filters.brands.forEach(b => $brand.append(`<option value="${b}">${b}</option>`));

      // Subcategory depends on category
      $('#subcategory').empty().append(`<option value="">Select Subcategory</option>`).prop('disabled', true);
    }

    function populateSubcategories(cat){
      const $sub = $('#subcategory');
      $sub.empty();
      if(!cat){ $sub.append(`<option value="">Select Subcategory</option>`).prop('disabled', true); return; }
      const found = db.filters.categories.find(c => c.name === cat);
      $sub.append(`<option value="">All Subcategories</option>`);
      (found?.subcategories || []).forEach(s => $sub.append(`<option value="${s}">${s}</option>`));
      $sub.prop('disabled', false);
    }

    function fileExt(name){
      const i = name.lastIndexOf('.');
      return i>0 ? name.slice(i+1).toLowerCase() : '';
    }

    function activeChips(){
      const chips = [];
      if(state.search) chips.push({k:'Search', v: state.search, id:'chip-search'});
      if(state.category) chips.push({k:'Category', v: state.category, id:'chip-category'});
      if(state.subcategory) chips.push({k:'Subcategory', v: state.subcategory, id:'chip-subcategory'});
      if(state.brand) chips.push({k:'Brand', v: state.brand, id:'chip-brand'});
      if(state.filetypes.size){ chips.push({k:'Type', v: [...state.filetypes].join(', ').toUpperCase(), id:'chip-type'}); }

      const $wrap = $('#activeChips');
      $wrap.empty();
      chips.forEach(c => {
        $wrap.append(`<span class="chip" data-id="${c.id}"><strong>${c.k}:</strong> ${c.v} <span class="x" title="Remove">✕</span></span>`);
      });
    }

    function matchSearch(p){
      if(!state.search) return true;
      const q = state.search.toLowerCase();
      return [p.brand, p.category, p.subcategory, p.filename].some(x => (x||'').toLowerCase().includes(q));
    }

    function matchFilters(p){
      if(state.category && p.category !== state.category) return false;
      if(state.subcategory && p.subcategory !== state.subcategory) return false;
      if(state.brand && p.brand !== state.brand) return false;
      if(state.filetypes.size && !state.filetypes.has(fileExt(p.filename))) return false;
      return true;
    }

    function render(){
      const list = db.products.filter(p => matchSearch(p) && matchFilters(p));
      $('#resultCount').text(`${list.length} result${list.length!==1?'s':''}`);
      const $cards = $('#cards');
      $cards.empty();

      if(!list.length){ $('#emptyState').show(); return; }
      $('#emptyState').hide();

      list.forEach(p => {
        const ext = fileExt(p.filename).toUpperCase();
        const html = `
          <article class="product">
            <div class="thumb"><img src="${p.logo}" alt="${p.brand} logo" /></div>
            <div class="body">
              <h3 style="margin:0 0 6px; font-size:16px;">${p.brand}</h3>
              <div class="kvs">
                <span class="kv">${p.category}</span>
                <span class="kv">${p.subcategory}</span>
                <span class="kv">${ext}</span>
              </div>
              <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">${p.filename}</div>
              <div class="actions">
                <a class="btn btn-primary" href="${p.downloadlink}" target="_blank" rel="noopener">Download</a>
                <button class="btn btn-ghost copy" data-copy="${p.downloadlink}">Copy Link</button>
              </div>
            </div>
          </article>`;
        $cards.append(html);
      });
    }

    // Debounce helper for search
    function debounce(fn, delay){
      let t; return function(){ clearTimeout(t); const args = arguments; t = setTimeout(() => fn.apply(this, args), delay); };
    }

    // --- Init ---------------------------------
    $(function(){
      populateFilters();
      render();

      // Search
      $('#search').on('input', debounce(function(){ state.search = $(this).val().trim(); activeChips(); render(); }, 200));

      // Category change
      $('#category').on('change', function(){
        state.category = $(this).val();
        state.subcategory = "";
        populateSubcategories(state.category);
        $('#subcategory').val("");
        // sync quick checkboxes
        $('input[type=checkbox][data-category]').prop('checked', false);
        if(state.category){ $(`input[type=checkbox][data-category='${state.category}']`).prop('checked', true); }
        activeChips();
        render();
      });

      // Subcategory change
      $('#subcategory').on('change', function(){ state.subcategory = $(this).val(); activeChips(); render(); });

      // Brand change
      $('#brand').on('change', function(){ state.brand = $(this).val(); activeChips(); render(); });

      // Quick filter checkboxes
      $('input[type=checkbox][data-category]').on('change', function(){
        if($(this).is(':checked')){ state.category = $(this).data('category'); $('#category').val(state.category); populateSubcategories(state.category); }
        else { state.category = ""; $('#category').val(""); populateSubcategories(""); }
        state.subcategory = ""; $('#subcategory').val(""); activeChips(); render();
      });

      // File type filters
      $('.filetype').on('change', function(){
        const val = $(this).val();
        if($(this).is(':checked')) state.filetypes.add(val); else state.filetypes.delete(val);
        activeChips(); render();
      });

      // Clear buttons
      $('#clearFilters').on('click', function(){
        state.search = ""; state.category = ""; state.subcategory = ""; state.brand = ""; state.filetypes.clear();
        $('#search').val(""); $('#category').val(""); $('#subcategory').val("").prop('disabled', true); $('#brand').val("");
        $('.filetype').prop('checked', false); $('input[type=checkbox][data-category]').prop('checked', false);
        activeChips(); render();
      });

      $('#resetAll').on('click', function(){ $('#clearFilters').trigger('click'); });

      // Chip removal
      $('#activeChips').on('click', '.chip .x', function(){
        const id = $(this).closest('.chip').data('id');
        if(id==='chip-search'){ state.search=""; $('#search').val(""); }
        if(id==='chip-category'){ state.category=""; $('#category').val(""); populateSubcategories(""); $('#subcategory').val(""); $('input[type=checkbox][data-category]').prop('checked', false); }
        if(id==='chip-subcategory'){ state.subcategory=""; $('#subcategory').val(""); }
        if(id==='chip-brand'){ state.brand=""; $('#brand').val(""); }
        if(id==='chip-type'){ state.filetypes.clear(); $('.filetype').prop('checked', false); }
        activeChips(); render();
      });

      // Copy link
      $('#cards').on('click', '.copy', function(){
        const link = $(this).data('copy');
        navigator.clipboard.writeText(link).then(() => {
          const $btn = $(this); const prev = $btn.text();
          $btn.text('Copied ✔'); setTimeout(()=> $btn.text(prev), 1000);
        });
      });

      // Initial chips
      activeChips();
    });
  </script>
</body>
</html>
